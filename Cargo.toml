[package]
name = "ssz_types"
version = "0.11.0"
edition = "2021"
description = "List, vector and bitfield types for SSZ"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sigp/ssz_types"
documentation = "https://docs.rs/ssz_types"
keywords = ["ethereum"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = ["std"]
std = []

[dependencies]
tree_hash = { version = "0.10.0", default-features = false }
ethereum_serde_utils = "0.8.0"
ethereum_ssz = { version = "0.9.0", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "alloc",
    "derive",
] }
serde_derive = "1.0.0"
typenum = "1.12.0"
smallvec = "1.8.0"
arbitrary = { version = "1.0", features = ["derive"], optional = true }
itertools = { version = "0.13.0", default-features = false, features = [
    "use_alloc",
] }

[dev-dependencies]
serde_json = "1.0.0"
tree_hash_derive = "0.10.0"
